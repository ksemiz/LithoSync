; ─── LithoSync Root PlatformIO Config ─────────────────────────────────────────
; VS Code ana klasörü açıldığında PlatformIO'nun projeyi doğrudan tanımasını sağlar.
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
src_dir     = firmware/src
include_dir = firmware/include
default_envs = esp32c3supermini

[env:esp32c3supermini]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

; Serial / Upload
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, colorize

; ESP32-C3 Native USB (USB-CDC)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; Bağımlılıklar
lib_deps =
    fastled/FastLED                 @ ^3.9.0
    tzapu/WiFiManager               @ ^2.0.17
    mathieucarbou/ESPAsyncWebServer @ ^3.3.12
    bblanchon/ArduinoJson           @ ^7.1.0
