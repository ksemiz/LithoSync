; ─── IoT LED Project — PlatformIO Configuration ───────────────────────────────
; Donanım : ESP32-C3 Super Mini
; LED     : 6x WS2812B @ GPIO 8
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
default_envs = esp32c3supermini

[env:esp32c3supermini]
platform  = espressif32@^6.9.0
board     = lolin_c3_mini          ; ESP32-C3 Super Mini ile uyumlu
framework = arduino

; Serial / Upload
monitor_speed   = 115200
upload_speed    = 921600
monitor_filters = esp32_exception_decoder, colorize

; ESP32-C3 Native USB (USB-CDC)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

; ─── Bağımlılıklar ────────────────────────────────────────────────────────────
lib_deps =
    fastled/FastLED                 @ ^3.9.0    ; LED sürücüsü
    tzapu/WiFiManager               @ ^2.0.17   ; Captive Portal Wi-Fi kurulum
    mathieucarbou/ESPAsyncWebServer @ ^3.3.12   ; Asenkron HTTP sunucu
    bblanchon/ArduinoJson           @ ^7.1.0    ; JSON parse/serialize
